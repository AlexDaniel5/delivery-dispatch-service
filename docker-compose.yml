services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: dispatch
      POSTGRES_PASSWORD: dispatch
      POSTGRES_DB: dispatch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispatch -d dispatch"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      DISPATCH_DATABASE_URL: postgresql+psycopg://dispatch:dispatch@db:5432/dispatch
      DISPATCH_ASSIGNMENT_RADIUS_KM: "10.0"
      DISPATCH_COURIER_SPEED_KMH: "30.0"
      # Production: apply schema via Alembic migrations, not create_all-on-startup.
      DISPATCH_AUTO_CREATE_TABLES: "false"
      # Set to enable API-key auth, e.g. "key-a,key-b".
      DISPATCH_API_KEYS: ""
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
